[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nairobi_delivery_pipeline"
version = "1.0.0"
description = "PySpark medallion pipeline (bronze/silver/gold) for Nairobi on-demand delivery orders, deployable to Azure Databricks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joan Matata" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]   # pyspark is provided by the Databricks runtime

[project.optional-dependencies]
local = ["pyspark==4.0.1", "pandas>=2.2", "pyarrow>=15", "numpy>=1.26", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
delivery-pipeline = "pipeline.run:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
